	<meta name="keywords" content="Needleman-Wunsch, Smith-Waterman, alineamiento de secuencias, bioinformática, programación dinámica, sequence alignment visualizer, matriz de sustitución, traceback, algoritmos genéticos, ADN, ARN">

	<script type="application/ld+json">
	{
	  "@context": "https://schema.org",

	    "@type": "Person",

	<link rel="icon" href="./images/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="./style.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
	<link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
	<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
	<nav class="sidebar">
		<header>
			<div class="image-text">
				<div class="image">
					<img src="./images/ubb.png" alt="UBB">
				</div>
				<div class="logo-text">
					<span class="name">Bioinformática</span>
					<span class="profession">UBB</span>
				</div>
			</div>
		</header>

		<div class="menu-bar">
			<div class="menu">

				<li class="search-box">
					<i class='bx bx-dna icon'></i>
					<input class="seq" type="text" id="seq_1" maxlength="20"
						placeholder="Secuencia 1" value="AAG">
				</li>

				<li class="search-box">
					<i class='bx bx-dna icon'></i>
					<input class="seq" type="text" id="seq_2" maxlength="20"
						placeholder="Secuencia 2" value="AAG">
				</li>

				<li class="search-box">
					<i class='bx bx-check-circle icon'></i>
					<input class="params" id="matchScore" type="number" placeholder="Match (+1)" value="1" title="Puntaje por coincidencia (Match)" />
				</li>

				<li class="search-box">
					<i class='bx bx-x-circle icon'></i>
					<input class="params" id="mismatchScore" type="number" placeholder="Mismatch (-1)" value="-1" title="Puntaje por discrepancia (Mismatch)" />
				</li>

				<li class="search-box">
					<i class='bx bx-minus-circle icon'></i>
					<input class="params" id="gapScore" type="number" placeholder="Gap (-2)" value="-2" title="Penalización por Gap" />
				</li>

				<li class="btn-compute">
					<a href="#" id="calculateButton">
						<i class='bx bx-refresh icon'></i>
						<span class="text nav-text">Reiniciar</span>
					</a>
				</li>

				<li>
					<a href="#" class="btn-prev" id="anterior">
						<i class='bx bx-left-arrow-alt icon'></i>
						<span class="text nav-text">Anterior</span>
					</a>
				</li>
				<li>
					<a href="#" class="btn-next" id="siguiente">
						<i class='bx bx-right-arrow-alt icon'></i>
						<span class="text nav-text">Siguiente</span>
					</a>
				</li>
				<li>
					<a href="#" class="btn-fast" id="avanzarRapido">
						<i class='bx bx-fast-forward icon'></i>
						<span class="text nav-text">Avanzar Rápido</span>
					</a>
				</li>
				<li>
					<a href="https://github.com/FHX23/sequence-alignment-visualizer" target="_blank" rel="noopener noreferrer" class="btn-github" title="Ver código fuente en GitHub">
						<i class='bx bxl-github icon'></i>
						<span class="text nav-text">Código en GitHub</span>
					</a>
				</li>
			</div>
			<div class="bottom-content">
				<li class="mode">
					<div class="sun-moon">
						<i class='bx bx-globe icon moon'></i>
						<i class='bx bx-current-location icon sun'></i>
					</div>
					<span class="mode-text text">Global</span>
					<div class="toggle-switch">
						<span class="switch"></span>
					</div>
				</li>
			</div>
		</div>
	</nav>

	<main class="home">
		<div id="root-container"></div>
	</main>

	<script src='https://cdnjs.cloudflare.com/ajax/libs/d3/7.6.1/d3.min.js'></script>
	<script src="./visualizer.js"></script>
	<script src="./script.js"></script>
	<script src="./inicializar.js"></script>
	<script src="./siguiente.js"></script>
	<script src="./anterior.js"></script>
	<script src="./avanzar.js"></script>
	<script src="./retroceder.js"></script>
</body>

</html>
